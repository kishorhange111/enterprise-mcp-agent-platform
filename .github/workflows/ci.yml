name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,fastapi]"
      - name: Test with coverage (includes the security red-team suite)
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml
      - name: Coverage floor
        run: coverage report --fail-under=80

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t enterprise-mcp-agent-platform:ci .
      - name: Container serves /healthz as non-root
        run: |
          docker run -d --name api -p 8000:8000 enterprise-mcp-agent-platform:ci
          for i in $(seq 1 20); do curl -fsS localhost:8000/healthz && break || sleep 1; done
          curl -fsS localhost:8000/healthz
          test "$(docker exec api id -u)" = "10001"
      - if: failure()
        run: docker logs api
