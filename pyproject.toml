[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-mcp-agent-platform"
version = "0.1.0"
description = "Multi-tenant enterprise MCP server, secure tool connectors, stateful agent runtime, HITL approvals, observability, and evaluation harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kishor Hange" }]
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "starlette>=0.37",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "opentelemetry-api>=1.25",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.111"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "evals*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
